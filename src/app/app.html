<!-- Toolbar unificado: banderas + botón imprimir + panel de controles expandible -->
<app-toolbar
  [availableLanguages]="getAvailableLanguages()"
  [currentLanguage]="getCurrentLanguage()"
  (languageChange)="changeLanguage($event)"
  (print)="printPage()"
></app-toolbar>

<main class="main-container">
  @if (cvData) {
  <app-cv-content [cvData]="cvData" [profileImage]="profileImage"></app-cv-content>
  <div class="red-guide"></div>
  }
</main>
