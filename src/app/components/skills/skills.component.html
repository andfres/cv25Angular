<section class="p-4 mb-4">
  <h2 class="text-gray-800 text-xl font-bold mb-4">{{ 'sections.skills' | translate }}</h2>
  <ul class="list-none p-0">
    @for (skill of skills; track skill.name) {
      <li class="mb-2">
        {{ skill.name }} ({{ skill.level }}%)
      </li>
    }
  </ul>
</section>
