<section class="personal-info p-md mb-4">
  <h2 class="name">{{ 'personalInfo.name' | translate }}</h2>
  <p class="title">{{ 'personalInfo.title' | translate }}</p>
  <p class="location">{{ 'personalInfo.location' | translate }}</p>
  <p class="email">{{ 'personalInfo.email' | translate }}</p>
  <p class="objective" [innerHtml]="sanitizedObjective"></p>
</section>
