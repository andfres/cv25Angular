<main class="a4-page flexaf pt-4">
  <!-- Aside (columna izquierda 40%) -->
  <aside class="profile-personal-info-group flex flex-col basis-2/5 max-w-[40%] bg-gray-50 p-1 ">
    <div class="profile-image-container flex justify-center mb-4">
      <img
        [src]="profileImage"
        alt="{{ 'profile.picture' | translate }}"
        class="profile-image w-32 h-32 rounded-full object-cover shadow"
      />
    </div>

      <app-personal-info [personalInfo]="cvData.personalInfo"></app-personal-info>
      <!-- <app-skills [skills]="cvData.skills"></app-skills> -->
      <app-languages [languages]="cvData.languages"></app-languages>
  </aside>

  <!-- Main content (columna derecha 60%) -->
  <section class="main-content ">
    <app-experience-timeline [entries]="cvData.experience"></app-experience-timeline>
    <app-education-timeline [entries]="cvData.education"></app-education-timeline>
  </section>
</main>
